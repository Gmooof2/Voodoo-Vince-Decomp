# The public firewall audit: no game files, no secrets, no gate (byte identity needs your own copy of the game).
name: audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - run: python tools/audit_public.py --public-ci
